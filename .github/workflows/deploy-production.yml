name: Deploy production theme

on:
  workflow_run:
    workflows:
      - Theme CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/lfk-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lfk-deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/lfk-deploy -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "thaiada@$DEPLOY_HOST" "deploy ${{ github.event.workflow_run.head_sha }}"
